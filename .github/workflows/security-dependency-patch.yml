name: One-time CRM dependency security patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-dependency-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crm-security-dependency-patch-main
  cancel-in-progress: false

jobs:
  patch-and-verify:
    name: Patch vulnerable npm packages and verify before committing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply targeted security updates
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set \
            'dependencies.fastify=5.12.6' \
            'overrides.ip-address=10.7.4' \
            'overrides.hono=4.13.11' \
            'overrides.@hono/node-server=2.1.3'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          const expected = {
            fastify: '5.12.6',
            hono: '4.13.11',
            'ip-address': '10.7.4',
            '@hono/node-server': '2.1.3'
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = lock.packages['node_modules/' + name]?.version;
            if (actual !== version) throw new Error(name + ' expected ' + version + ', got ' + actual);
          }
          if (manifest.dependencies.fastify !== expected.fastify) throw new Error('fastify manifest mismatch');
          console.log('Verified security patch versions:', expected);
          NODE

      - name: Install updated locked dependency tree
        run: npm ci --no-audit --no-fund

      - name: Validate code and regression suite
        run: |
          npm run check
          npm test

      - name: Verify dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified lockfile and manifest straight to main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Already patched; no commit necessary"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix(deps): patch ip-address, hono, hono node-server and fastify CVEs'
          git push origin HEAD:main
