name: Refresh patched dependency lockfile
on:
  push:
    branches: [feat/inbox-workbench-20261012]
    paths:
      - package.json
      - .github/workflows/refresh-patched-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'csivr2ivr2-lgtm/aharon-crm-node-public' && github.ref == 'refs/heads/feat/inbox-workbench-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve patched dependencies without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact patched versions
        run: |
          node -e "const x=require('./package-lock.json');const p=x.packages;if(p['node_modules/@modelcontextprotocol/sdk']?.version<'1.31.0'||p['node_modules/sharp']?.version!=='0.35.5')process.exit(1);"
          git diff --check
      - name: Commit regenerated lockfile to PR branch
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): regenerate lock for patched MCP SDK and sharp'
          git push origin HEAD:feat/inbox-workbench-20261012
